<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Companies - Dairy Farm Shop</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        .navbar {
            background: #2e7d32;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2e7d32;
            margin-bottom: 25px;
        }

        .add-btn {
            display: inline-block;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .add-btn:hover {
            background: #1b5e20;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2e7d32;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .edit {
            background: #1976d2;
            color: white;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 5px;
        }

        .delete {
            background: #d32f2f;
            color: white;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 4px;
        }

        .edit:hover {
            background: #0d47a1;
        }

        .delete:hover {
            background: #b71c1c;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

    </style>

</head>

<body>

<div class="navbar">

    <strong>Dairy Farm Shop</strong>

    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/companies/add">Add Company</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<div class="container">

    <h2>Manage Companies</h2>

    <a href="/companies/add" class="add-btn">
        + Add Company
    </a>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Company Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="company : ${companies}">

                <td th:text="${company.id}"></td>

                <td th:text="${company.companyName}"></td>

                <td th:text="${company.description}"></td>

                <td>

                    <a
                        th:href="@{/companies/edit/{id}(id=${company.id})}"
                        class="edit">
                        Edit
                    </a>

                    <a
                        th:href="@{/companies/delete/{id}(id=${company.id})}"
                        class="delete"
                        onclick="return confirm('Are you sure you want to delete this company?');">
                        Delete
                    </a>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(companies)}">

                <td colspan="4" class="empty">
                    No companies found.
                </td>

            </tr>

        </tbody>

    </table>

</div>

</body>

</html>
