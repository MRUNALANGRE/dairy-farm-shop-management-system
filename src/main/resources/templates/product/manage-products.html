<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products - Dairy Farm Shop</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        .navbar {
            background: #2e7d32;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            width: 95%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2e7d32;
            margin-bottom: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-btn {
            background: #2e7d32;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 5px;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-form input {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .search-form button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .all-btn {
            background: #777;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2e7d32;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .edit {
            background: #1976d2;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 5px;
        }

        .delete {
            background: #d32f2f;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 4px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

    </style>

</head>

<body>

<div class="navbar">

    <strong>Dairy Farm Shop</strong>

    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/products/add">Add Product</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<div class="container">

    <h2>Manage Products</h2>

    <div class="top-bar">

        <a href="/products/add" class="add-btn">
            + Add Product
        </a>

        <form
            action="/products/search"
            method="get"
            class="search-form">

            <input
                type="text"
                name="productName"
                th:value="${searchName}"
                placeholder="Search product name"
                required>

            <button type="submit">
                Search
            </button>

            <a href="/products" class="all-btn">
                Show All
            </a>

        </form>

    </div>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Category ID</th>
                <th>Company ID</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="product : ${products}">

                <td th:text="${product.id}"></td>

                <td th:text="${product.productName}"></td>

                <td th:text="${product.description}"></td>

                <td th:text="${product.price}"></td>

                <td th:text="${product.quantity}"></td>

                <td th:text="${product.categoryId}"></td>

                <td th:text="${product.companyId}"></td>

                <td>

                    <a
                        th:href="@{/products/edit/{id}(id=${product.id})}"
                        class="edit">
                        Edit
                    </a>

                    <a
                        th:href="@{/products/delete/{id}(id=${product.id})}"
                        class="delete"
                        onclick="return confirm('Are you sure you want to delete this product?');">
                        Delete
                    </a>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(products)}">

                <td colspan="8" class="empty">
                    No products found.
                </td>

            </tr>

        </tbody>

    </table>

</div>

</body>

</html>
