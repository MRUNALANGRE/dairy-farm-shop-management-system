<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Manage Categories - Dairy Farm Shop</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        .navbar {
            background: #2e7d32;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            width: 90%;
            margin: 40px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
        }

        .add-button {
            background: #2e7d32;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #2e7d32;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .edit {
            background: #1976d2;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete {
            background: #c62828;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 4px;
            margin-left: 5px;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

    </style>

</head>

<body>

<div class="navbar">

    <strong>Dairy Farm Shop</strong>

    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/categories">Categories</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<div class="container">

    <div class="header">

        <h2>Manage Categories</h2>

        <a href="/categories/add" class="add-button">
            + Add Category
        </a>

    </div>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Category Name</th>
            <th>Description</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="category : ${categories}">

            <td th:text="${category.id}"></td>

            <td th:text="${category.categoryName}"></td>

            <td th:text="${category.description}"></td>

            <td>

                <a
                    th:href="@{/categories/edit/{id}(id=${category.id})}"
                    class="edit">
                    Edit
                </a>

                <a
                    th:href="@{/categories/delete/{id}(id=${category.id})}"
                    class="delete"
                    onclick="return confirm('Are you sure you want to delete this category?');">
                    Delete
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(categories)}">

            <td colspan="4" class="empty">
                No categories found.
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
